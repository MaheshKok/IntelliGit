name: E2E Flow Suite - Nightly

on:
    schedule:
        - cron: "0 2 * * *"
    # A scheduled-only workflow can never be exercised before its first firing, which means the
    # first proof it works arrives at 2am on a day nobody is watching. Manual dispatch makes it
    # testable on demand; it still gates nothing either way.
    workflow_dispatch:

# Early warning only: this workflow is intentionally not connected to release.
permissions:
    contents: read

jobs:
    e2e-nightly:
        # Four shards currently mean four container builds and four VS Code downloads. With ten
        # rows, that almost certainly costs more wall-clock than one run; the matrix is
        # infrastructure for when the suite grows, not a present-day speedup. The suite it runs is
        # also the same one the PR tier runs today -- `test:e2e` is the ten implemented flows, and
        # the other 77 mutating surfaces in `tests/e2e/coverage-manifest.ts` are still `notCovered`.
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Cache the pinned VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-vscode-${{ hashFiles('tests/e2e/hostFixtures/vscodeVersion.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-

            - name: Run nightly flow shard in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && xvfb-run -a bun run test:e2e -- --shard=${{ matrix.shard }}/4'

            - name: Upload nightly failure artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-nightly-failures-shard-${{ matrix.shard }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    # One pinned VS Code launch per fixture catches content and serialization drift in the
    # committed artifacts; it is deliberately separate from the flow matrix so one stale theme
    # cannot mask the other three.
    host-fixture-staleness:
        runs-on: ubuntu-latest
        timeout-minutes: 120

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Cache the pinned VS Code build
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-vscode-${{ hashFiles('tests/e2e/hostFixtures/vscodeVersion.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-

            - name: Run pinned host-fixture staleness sweep in the container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && xvfb-run -a ./node_modules/.bin/playwright test --config playwright.e2e.config.ts tests/e2e/hostFixtures/staleness.spec.ts --reporter=list'

            - name: Upload host-fixture staleness failure artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-nightly-host-fixture-staleness-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    # Reporting is a separate job for two reasons. It collapses four shards into ONE notification --
    # per-shard reporting would file up to four issues a night -- and it keeps `issues: write` off
    # the jobs that execute the suite, so only this job can write to the tracker.
    report-failure:
        needs: [e2e-nightly, host-fixture-staleness]
        # `failure()` is load-bearing, not stylistic. A job whose `if` contains no status-check
        # function still carries GitHub's implicit `success()` gate, so a bare
        # `needs.<job>.result == 'failure'` expression can never be true when that job failed --
        # the notifier would silently stop firing. `failure()` is true when ANY need failed, which
        # is exactly the aggregation wanted, and matches `e2e-insiders.yml`'s identical job.
        if: failure()
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write

        steps:
            # A nightly that stays broken must not file a new issue every night: that is not early
            # warning, it is noise that trains everyone to ignore the tracker. Comment on the open
            # issue when one already exists, and only open a new one when there is none.
            - name: Report the failing nightly run
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TITLE: "Nightly E2E flow suite is failing"
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  BODY="The nightly flow suite or host-fixture staleness sweep failed. Inspect the run: ${RUN_URL}"
                  # `env.TITLE` is read by jq itself, so the title never passes through shell
                  # interpolation into the jq program.
                  EXISTING=$(gh issue list --state open --search "${TITLE} in:title" \
                      --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')

                  if [ -n "${EXISTING}" ]; then
                      gh issue comment "${EXISTING}" --body "${BODY}"
                  else
                      gh issue create --title "${TITLE}" --body "${BODY}"
                  fi
