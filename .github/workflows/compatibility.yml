name: Installed-package portability

on:
    # No `paths:` filter, deliberately. This workflow's Windows leg is a required status check, and
    # a required check that never reports blocks a pull request forever rather than passing it -- so
    # a documentation-only change has to get a verdict here too, not silence. `ciHardeningWorkflows`
    # asserts the absence rather than trusting a comment.
    pull_request:
        branches:
            - main
    schedule:
        - cron: "43 3 * * 0"
    workflow_dispatch:

permissions:
    contents: read

# The Windows leg runs about thirty minutes, so a superseded pull-request run spends half an hour of
# a runner on a commit nobody will merge. Scheduled runs are exempt on purpose: only one is ever in
# flight, and cancelling it would drop that week's result rather than replace it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    compatibility:
        name: Installed package smoke (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: "1.3.5"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # `bun run test` includes tests/unit/visual/screenshotComparatorMeta.test.ts, which
            # launches a real Chromium to prove the screenshot comparator. Without this the suite
            # fails on the browser binary rather than on anything this workflow is meant to check.
            - name: Install the Playwright browser the comparator proof runs against
              run: bunx playwright install --with-deps chromium

            - name: Check formatting
              run: bun run format:check

            - name: Run ESLint
              run: bun run lint

            - name: Run type check
              run: bun run typecheck

            - name: Build extension
              run: bun run build

            # The wall-clock budgets in `src/diff/diffBudgets.ts` are single-host measurements
            # with 2x headroom, and a shared runner is not that host: the same commit measured
            # large render at 6,555.914 ms here against a 5,613 ms target, while the macOS leg of
            # this very matrix passed. The deterministic assertions -- payload byte size, line
            # counts, pathological rejection -- still run, and so do the host-agnostic bounds in
            # `merge-editor-performance.integration.test.tsx` (15 s render, 10 s resolve) that
            # exist to catch a quadratic re-render. What is dropped here is a stopwatch reading
            # against hardware it was not calibrated on, which cannot see a product regression
            # underneath the runner's own variance.
            - name: Run tests
              env:
                  INTELLIGIT_SKIP_TIMING_BUDGETS: "1"
              run: bun run test

            - name: Package extension
              run: bun run package

            - name: Smoke test the installed package on Linux
              if: matrix.os == 'ubuntu-latest'
              shell: bash
              run: INTELLIGIT_VSCODE_VERSION=1.132.0 xvfb-run -a bun run test:package-smoke

            - name: Smoke test the installed package on macOS and Windows
              if: matrix.os != 'ubuntu-latest'
              shell: bash
              run: INTELLIGIT_VSCODE_VERSION=1.132.0 bun run test:package-smoke
