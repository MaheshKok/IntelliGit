name: CI - Build & Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_publish:
                description: "Publish the current package.json version even if it already has a GitHub Release (use to recover a marketplace upload that did not land)."
                type: boolean
                default: false
            skip_e2e_gate:
                description: "Allow a manual main-branch release to proceed when the same-SHA full E2E gate fails; use only after auditing the failure."
                type: boolean
                default: false

# Keyed by event so a manual workflow_dispatch on main cannot cancel an
# in-flight push-triggered release run (they target the same ref).
concurrency:
    group: build-release-${{ github.event_name }}-${{ github.ref }}
    # A superseded pull-request run is waste worth cancelling; a superseded main run is a lost
    # release. Two merges land in the same group -- same event (`push`), same ref
    # (`refs/heads/main`) -- so merging again while a release is in flight cancels it, and a
    # cancelled run reports no failure, shows no red X, and notifies nobody. Measured: v0.25.3's
    # release run was cancelled by the merge that followed it minutes later, and the release was
    # silently lost. Main pushes therefore queue instead of cancelling.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

env:
    BUN_VERSION: "1.3.5"

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The coverage suite includes a real Chromium proof for the visual
            # comparator, so this browser is a test dependency rather than a cache
            # optimisation.
            - name: Install the Playwright browser the comparator proof runs against
              run: bunx playwright install --with-deps chromium

            - name: Check formatting
              run: bun run format:check

            - name: Run React Doctor
              run: bun run react-doctor

            - name: Run strict ESLint
              run: bun run lint:strict

            - name: Check unused files and dependencies
              run: bun run deps:check:strict

            - name: Check architecture boundaries
              run: bun run architecture:check

            - name: Check manifest does not expose E2E control commands
              run: bun run verify:manifest

            - name: Validate localization catalogs
              run: bun run l10n:validate

            - name: Audit hardcoded localization strings
              run: bun run l10n:audit

            - name: Run type check
              run: bun run typecheck

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Build extension
              run: bun run build

            - name: Package extension
              run: bun run package

            - name: Resolve packaged VSIX and create checksum
              id: package-artifact
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  if [ "${#vsix_files[@]}" -ne 1 ]; then
                    echo "Expected exactly one packaged VSIX, found ${#vsix_files[@]}." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  sha256sum "$VSIX_PATH" > "$CHECKSUM_PATH"
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
                  echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

            - name: Upload release artifacts
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: extension-vsix
                  path: |
                      *.vsix
                      *.vsix.sha256
                  if-no-files-found: error
                  retention-days: 30

    # Blocks a PR from carrying a CI-skip token into main via squash merge.
    guard-no-skip-ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Reject CI-skip directives in PR commits and metadata
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/check-no-skip-ci.js

    # The visual suite executes in the same digest-pinned Linux image that
    # maintains its baselines. Container jobs run as root and make Chromium
    # diverge, so the wrapper runs the image unprivileged instead.
    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Run visual suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && bun run test:visual'

            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: visual-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    # The flow suite, and the same-SHA gate the release chain below waits on.
    #
    # It carries no `if:` on purpose. It used to be guarded to main pushes and
    # dispatches, which meant the job the release gate names reported `skipping`
    # on every pull request -- so the suite first ran after the merge, where it
    # can no longer stop one. Measured: 0.25.4's push to main went red here
    # behind a pull request that had been green without ever running this job.
    #
    # `.github/workflows/e2e.yml` runs the byte-identical suite for the pull
    # requests this workflow does not see (those based on anything but main), so
    # exactly one job executes it per event -- pinned by the duplication check in
    # tests/unit/visual/publishWorkflow.test.ts.
    e2e-full:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Cache the pinned VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-vscode-${{ hashFiles('tests/e2e/hostFixtures/vscodeVersion.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-

            - name: Run the full flow suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && xvfb-run -a bun run test:e2e'

            - name: Upload full E2E failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-full-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    package-smoke:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                vscode_version: ["1.96.0", "1.132.0"]

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Download packaged VSIX
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Cache the package-smoke VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-package-smoke-vscode-${{ matrix.vscode_version }}

            - name: Verify downloaded VSIX and checksum
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  if [ "${checksum_files[0]}" != "${vsix_files[0]}.sha256" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  sha256sum --check "${checksum_files[0]}"

            - name: Run installed package smoke in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && INTELLIGIT_VSCODE_VERSION=${{ matrix.vscode_version }} xvfb-run -a bun run test:package-smoke'

    # Eligibility has no production environment or secrets. It is deliberately
    # split from the publishing job so a same-version change never instantiates
    # a job that can access Marketplace credentials.
    release-eligibility:
        needs: [build, visual, e2e-full, package-smoke]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && needs.visual.result == 'success' && needs.package-smoke.result == 'success' && (needs.e2e-full.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_e2e_gate == true)) }}
        outputs:
            version_changed: ${{ steps.version-check.outputs.version_changed }}
            new_version: ${{ steps.version-check.outputs.new_version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Check whether this version still needs releasing
              id: version-check
              env:
                  FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
                  PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $CURRENT_VERSION"

                  if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                    PREVIOUS_VERSION=$(git show "$PUSH_BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    PREVIOUS_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  else
                    PREVIOUS_VERSION="0.0.0"
                  fi

                  echo "Previous version: $PREVIOUS_VERSION"
                  if [ "$FORCE_PUBLISH" = "true" ]; then
                    node scripts/verifyReleaseVersion.js --require-equal "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                    echo "Force publish recovery accepted for unchanged version $CURRENT_VERSION."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # The version transition is validated on its own terms, separately from the decision
                  # to publish. `verifyReleaseVersion.js` rejects anything that is not canonical stable
                  # SemVer -- leading zeros, prerelease and build metadata included -- which also keeps
                  # a value carrying a newline out of $GITHUB_OUTPUT, where `echo "k=$v"` would append
                  # step outputs of its own choosing, `version_changed` among them.
                  #
                  # The forward check runs only when the version actually moved. Requiring
                  # current > previous unconditionally would reject the recovery case below, where an
                  # orphaned bump is republished from a LATER commit that did not touch the version.
                  # An unchanged version is instead asserted equal, which validates the shape of both
                  # values without asserting an ordering that did not happen.
                  if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
                    node scripts/verifyReleaseVersion.js --require-equal "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                  else
                    node scripts/verifyReleaseVersion.js "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                  fi

                  # State, not diff. Comparing package.json against the previous commit asks "did THIS
                  # push bump the version", which can never recover from a run that failed to reach the
                  # release job: the bump is orphaned, and every later commit reports "unchanged" and
                  # skips forever. Measured -- 0.25.2's run failed at e2e-full and 0.25.3's run was
                  # cancelled, after which main could publish neither, with no failure anywhere to say
                  # so. The GitHub Release is the last artifact the release job creates, so its absence
                  # is the honest answer to "has this version shipped". Asking that is idempotent: it
                  # publishes a bump, it skips an already-released version, and it self-heals a missed
                  # run on the next push.
                  #
                  # Only an HTTP status counts as an answer. Every way of asking exits 1 for a missing
                  # release AND for auth, rate-limit and network failures, so the exit code alone can
                  # never decide this -- and `gh release view`'s messages, which used to decide it, are
                  # human-readable prose GitHub is free to reword under us. The release-by-tag REST
                  # endpoint answers the same question as a status code: 200 is present, 404 is absent,
                  # anything else is an unknown state.
                  #
                  # Measured on gh 2.87.3: `-i` prints the status line as the FIRST line of stdout for
                  # 200, 404 and 401 alike, while gh's own prose goes to stderr. So stdout is parsed
                  # for the decision and stderr is left unredirected, where it lands in the step log as
                  # the diagnostic. A gh that cannot run at all prints no status line, which parses to
                  # empty and falls through to the failure branch.
                  #
                  # Reading any of that as "never released" would republish on a transient blip and
                  # would report a broken token as "this version has not shipped" -- the exact
                  # misdiagnosis that left 0.25.2 and 0.25.3 unreleased. Failing instead costs nothing
                  # now that the gate reads state: the next push simply asks again.
                  RELEASE_PROBE=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$CURRENT_VERSION" || true)
                  HTTP_STATUS=$(printf '%s\n' "$RELEASE_PROBE" | awk 'NR == 1 { print $2 }')
                  if [ "$HTTP_STATUS" = "200" ]; then
                    echo "v$CURRENT_VERSION already has a GitHub Release; nothing to publish."
                    echo "version_changed=false" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  elif [ "$HTTP_STATUS" = "404" ]; then
                    echo "v$CURRENT_VERSION has no GitHub Release yet; publishing."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    echo "Could not read the release state of v$CURRENT_VERSION (HTTP ${HTTP_STATUS:-none})." >&2
                    exit 1
                  fi

    attest:
        needs: [build, release-eligibility]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.release-eligibility.result == 'success' && needs.release-eligibility.outputs.version_changed == 'true' }}
        permissions:
            contents: read
            id-token: write
            attestations: write

        steps:
            - name: Download packaged VSIX
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Resolve and verify attestation subject
              id: release-artifact
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  if [ "${checksum_files[0]}" != "$CHECKSUM_PATH" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  sha256sum --check "$CHECKSUM_PATH"
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

            - name: Attest packaged VSIX provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: ${{ steps.release-artifact.outputs.vsix_path }}

    release:
        needs: [build, visual, e2e-full, package-smoke, release-eligibility, attest]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: marketplace-production
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && needs.visual.result == 'success' && needs.package-smoke.result == 'success' && (needs.e2e-full.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_e2e_gate == true)) && needs.release-eligibility.result == 'success' && needs.release-eligibility.outputs.version_changed == 'true' && needs.attest.result == 'success' }}
        permissions:
            contents: write

        steps:
            # Without this the bypass is invisible in the release history: the
            # job annotation expires with logs while the release must stay auditable.
            - name: Record that the E2E gate was overridden
              if: needs.e2e-full.result != 'success'
              run: echo "::warning::Published with a non-successful e2e-full gate via the skip_e2e_gate override."

            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install release dependencies
              run: bun install --frozen-lockfile

            - name: Check publish status
              id: publish-status
              run: node scripts/check-extension-publish-status.js

            - name: Refuse rebuilt-artifact recovery for a published version
              shell: bash
              run: |
                  if [ "$VSCE_PUBLISHED" = "true" ] || [ "$OVSX_PUBLISHED" = "true" ]; then
                    echo "A published version must be recovered from its original artifact; refusing to publish rebuilt bytes for the same version." >&2
                    exit 1
                  fi
                  RELEASE_ERROR=$(mktemp)
                  if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$NEW_VERSION" --silent 2>"$RELEASE_ERROR"; then
                    echo "A GitHub release already exists for v$NEW_VERSION; refusing to replace its assets with rebuilt bytes." >&2
                    exit 1
                  fi
                  if ! node scripts/verifyGhApiNotFound.js "$RELEASE_ERROR"; then
                    echo "Unable to determine whether the GitHub release exists; failing closed." >&2
                    exit 1
                  fi
              env:
                  VSCE_PUBLISHED: ${{ steps.publish-status.outputs.vsce_published }}
                  OVSX_PUBLISHED: ${{ steps.publish-status.outputs.ovsx_published }}
                  NEW_VERSION: ${{ needs.release-eligibility.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Download packaged VSIX
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Resolve and verify release artifact
              id: release-artifact
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  if [ "${checksum_files[0]}" != "$CHECKSUM_PATH" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  sha256sum --check "$CHECKSUM_PATH"
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
                  echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

            - name: Validate and create release tag
              shell: bash
              run: |
                  VERSION="v$NEW_VERSION"
                  TAG_ERROR=$(mktemp)
                  if ! TAG_REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '[.object.type, .object.sha] | @tsv' 2>"$TAG_ERROR"); then
                    if ! grep -q '(HTTP 404)' "$TAG_ERROR"; then
                      cat "$TAG_ERROR" >&2
                      echo "Unable to read the live release tag; failing closed." >&2
                      exit 1
                    fi
                    gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$VERSION" \
                      -f sha="$EXPECTED_SHA" >/dev/null
                    TAG_REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '[.object.type, .object.sha] | @tsv')
                  fi
                  IFS=$'\t' read -r TAG_TYPE TAG_SHA <<< "$TAG_REF"
                  if [ "$TAG_TYPE" != "commit" ] || [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
                    echo "Live tag $VERSION resolves to $TAG_TYPE $TAG_SHA, expected commit $EXPECTED_SHA." >&2
                    exit 1
                  fi
                  echo "Live tag $VERSION resolves to the current release SHA."
              env:
                  NEW_VERSION: ${{ needs.release-eligibility.outputs.new_version }}
                  EXPECTED_SHA: ${{ github.sha }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to VS Code Marketplace
              run: bunx vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
              env:
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Publish to Open VSX
              run: bunx ovsx publish -p "$OVSX_PAT" "$VSIX_PATH"
              env:
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Create GitHub Release and upload artifacts
              shell: bash
              run: |
                  release_notes=()
                  if [ "${{ needs.e2e-full.result }}" != "success" ]; then
                    release_notes+=(--notes "E2E gate override: this release was published with a non-successful e2e-full gate via the skip_e2e_gate override.")
                  fi
                  gh release create "v$NEW_VERSION" "$VSIX_PATH" "$CHECKSUM_PATH" --generate-notes "${release_notes[@]}"
              env:
                  NEW_VERSION: ${{ needs.release-eligibility.outputs.new_version }}
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  CHECKSUM_PATH: ${{ steps.release-artifact.outputs.checksum_path }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
