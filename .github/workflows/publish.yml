name: CI - Build & Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_publish:
                description: "Publish the current package.json version even if it is unchanged from the previous commit (use to recover a deploy that GitHub skipped)."
                type: boolean
                default: false

# Keyed by event so a manual workflow_dispatch on main cannot cancel an
# in-flight push-triggered release run (they target the same ref).
concurrency:
    group: build-release-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    BUN_VERSION: "1.3.5"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run format:check

            - name: Run React Doctor
              run: bun run react-doctor

            - name: Run strict ESLint
              run: bun run lint:strict

            - name: Check unused files and dependencies
              run: bun run deps:check:strict

            - name: Check architecture boundaries
              run: bun run architecture:check

            - name: Check manifest does not expose E2E control commands
              run: bun run verify:manifest

            - name: Validate localization catalogs
              run: bun run l10n:validate

            - name: Audit hardcoded localization strings
              run: bun run l10n:audit

            - name: Run type check
              run: bun run typecheck

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Build extension
              run: bun run build

            - name: Package extension
              run: bunx vsce package --no-dependencies

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-vsix
                  path: "*.vsix"

    # Blocks a PR from carrying a CI-skip token into main via squash merge.
    # GitHub creates zero workflow runs for a push whose commit message contains
    # such a token, so a skipped deploy cannot be detected after the fact -- it
    # must be prevented before merge. This job ONLY protects the repo when it is
    # marked as a required status check on the main branch ruleset AND direct
    # pushes to main are disallowed (both configured on ruleset 12862467).
    guard-no-skip-ci:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Reject CI-skip directives in PR commits and metadata
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/check-no-skip-ci.js

    # Layer 1 visual tests (PLAN.md step 27). Runs the real webview bundles in
    # Chromium through the Phase 3 harness.
    #
    # Deliberately NOT a `container:` job on the pinned image. A container job
    # runs as root, Chromium will not keep its sandbox as root, and the usual
    # `--no-sandbox` workaround makes CI diverge from the image that generates
    # the committed baselines. `run.sh` already solves this: it builds the
    # digest-pinned image from `tests/e2e/docker/`, forces linux/amd64, asserts
    # the built image really is amd64, and runs unprivileged as the invoking
    # uid so it can write into the checkout. Using it here means CI, a local
    # developer run, and baseline generation are all the same image — which is
    # the entire premise of pinning it by digest. See
    # `tests/e2e/docker/base-image.txt` for why font rasterization makes that
    # non-negotiable.
    #
    # A GitHub runner is natively amd64, so the platform pin costs nothing here;
    # on an Apple Silicon developer machine the same command runs emulated.
    visual:
        runs-on: ubuntu-latest

        # The suite itself takes seconds; the budget is almost entirely the base
        # image pull and `bun install`. A bound well above that still fails far
        # sooner than the 6-hour default if the container ever wedges.
        timeout-minutes: 25

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # `bun install` and `bun run build` happen INSIDE the container, not
            # on the runner: the harness serves `dist/` bundles straight to
            # Chromium, so they must be built by the same toolchain that renders
            # them. Native dependencies built on the runner would also be
            # overwritten by the container's own node_modules mount.
            - name: Run visual suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && bun run test:visual'

            # Traces and failure screenshots are the only way to diagnose a
            # visual failure after the container is gone.
            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: visual-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    release:
        # A visual regression must not reach the Marketplace. `build` alone was
        # the gate before the visual suite existed; leaving it that way would
        # mean the suite gates nothing on the one path that ships to users.
        needs: [build, visual]
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if version changed
              id: version-check
              env:
                  FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $CURRENT_VERSION"

                  # force_publish is a recovery lever for when GitHub silently
                  # skipped a push-to-main deploy (e.g. a CI-skip token reached
                  # the merge commit). It only bypasses the version-change gate;
                  # the publish-status guard (check-extension-publish-status.js)
                  # still prevents re-publishing an already-live version, so a
                  # forced re-run of the same version is safe. workflow_dispatch
                  # itself requires repo write access, which gates who can use it.
                  if [ "$FORCE_PUBLISH" = "true" ]; then
                    echo "Force publish requested via workflow_dispatch; bypassing version comparison."
                    echo "version_changed=true" >> $GITHUB_OUTPUT
                    echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    git checkout HEAD~1 -- package.json
                    PREVIOUS_VERSION=$(node -p "require('./package.json').version")
                    git checkout HEAD -- package.json
                  else
                    PREVIOUS_VERSION="0.0.0"
                  fi

                  echo "Previous version: $PREVIOUS_VERSION"

                  if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                    echo "version_changed=true" >> $GITHUB_OUTPUT
                    echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  else
                    echo "version_changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Setup Node.js
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Setup Bun
              if: steps.version-check.outputs.version_changed == 'true'
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install release dependencies
              if: steps.version-check.outputs.version_changed == 'true'
              run: bun install --frozen-lockfile

            - name: Check publish status
              if: steps.version-check.outputs.version_changed == 'true'
              id: publish-status
              run: node scripts/check-extension-publish-status.js

            - name: Download VSIX artifact
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/download-artifact@v4
              with:
                  name: extension-vsix

            - name: Publish to VS Code Marketplace
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Skip VS Code Marketplace publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to VS Code Marketplace. Skipping."

            - name: Publish to Open VSX
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx ovsx publish -p "$OVSX_PAT" "$VSIX_PATH"
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Skip Open VSX publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to Open VSX. Skipping."

            - name: Create git tag
              if: steps.version-check.outputs.version_changed == 'true'
              run: |
                  VERSION="v$NEW_VERSION"
                  if git rev-parse "$VERSION" >/dev/null 2>&1; then
                    echo "Tag $VERSION already exists, skipping tag creation."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$VERSION"
                  git push origin "$VERSION"
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}

            - name: Check if GitHub release exists
              if: steps.version-check.outputs.version_changed == 'true'
              id: github-release-check
              run: |
                  VERSION="v$NEW_VERSION"
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    echo "release_exists=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "release_exists=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release and upload VSIX
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists != 'true'
              run: gh release create "v$NEW_VERSION" *.vsix --generate-notes
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update GitHub Release asset
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists == 'true'
              run: gh release upload "v$NEW_VERSION" *.vsix --clobber
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
