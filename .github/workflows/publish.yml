name: CI - Build & Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_publish:
                description: "Publish the current package.json version even if it already has a GitHub Release (use to recover a marketplace upload that did not land)."
                type: boolean
                default: false
            skip_e2e_gate:
                description: "Allow a manual main-branch release to proceed when the same-SHA full E2E gate fails; use only after auditing the failure."
                type: boolean
                default: false

# Keyed by event so a manual workflow_dispatch on main cannot cancel an
# in-flight push-triggered release run (they target the same ref).
concurrency:
    group: build-release-${{ github.event_name }}-${{ github.ref }}
    # A superseded pull-request run is waste worth cancelling; a superseded main run is a lost
    # release. Two merges land in the same group -- same event (`push`), same ref
    # (`refs/heads/main`) -- so merging again while a release is in flight cancels it, and a
    # cancelled run reports no failure, shows no red X, and notifies nobody. Measured: v0.25.3's
    # release run was cancelled by the merge that followed it minutes later, and the release was
    # silently lost. Main pushes therefore queue instead of cancelling.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

env:
    BUN_VERSION: "1.3.5"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      ~/.cache/ms-playwright
                  key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # `test:coverage` below is the only place vitest runs, and one of its specs
            # (tests/unit/visual/screenshotComparatorMeta.test.ts) spawns a real Playwright run to
            # prove the pixel comparator rejects a mismatched baseline. Without a browser that spec
            # cannot execute at all, so the assertion it makes would be a prediction rather than a
            # result. Only chromium is installed: it is the sole browser any spec in this job uses.
            # The Playwright version lives in bun.lock, so the cache key above already scopes this.
            - name: Install the Playwright browser the comparator proof runs against
              run: bunx playwright install --with-deps chromium

            - name: Check formatting
              run: bun run format:check

            - name: Run React Doctor
              run: bun run react-doctor

            - name: Run strict ESLint
              run: bun run lint:strict

            - name: Check unused files and dependencies
              run: bun run deps:check:strict

            - name: Check architecture boundaries
              run: bun run architecture:check

            - name: Check manifest does not expose E2E control commands
              run: bun run verify:manifest

            - name: Validate localization catalogs
              run: bun run l10n:validate

            - name: Audit hardcoded localization strings
              run: bun run l10n:audit

            - name: Run type check
              run: bun run typecheck

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Build extension
              run: bun run build

            - name: Package extension
              run: bunx vsce package --no-dependencies

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: extension-vsix
                  path: "*.vsix"

    # Blocks a PR from carrying a CI-skip token into main via squash merge.
    # GitHub creates zero workflow runs for a push whose commit message contains
    # such a token, so a skipped deploy cannot be detected after the fact -- it
    # must be prevented before merge. This job ONLY protects the repo when it is
    # marked as a required status check on the main branch ruleset AND direct
    # pushes to main are disallowed (both configured on ruleset 12862467).
    guard-no-skip-ci:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Reject CI-skip directives in PR commits and metadata
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/check-no-skip-ci.js

    # Layer 1 visual tests (PLAN.md step 27). Runs the real webview bundles in
    # Chromium through the Phase 3 harness.
    #
    # Deliberately NOT a `container:` job on the pinned image. A container job
    # runs as root, Chromium will not keep its sandbox as root, and the usual
    # `--no-sandbox` workaround makes CI diverge from the image that generates
    # the committed baselines. `run.sh` already solves this: it builds the
    # digest-pinned image from `tests/e2e/docker/`, forces linux/amd64, asserts
    # the built image really is amd64, and runs unprivileged as the invoking
    # uid so it can write into the checkout. Using it here means CI, a local
    # developer run, and baseline generation are all the same image — which is
    # the entire premise of pinning it by digest. See
    # `tests/e2e/docker/base-image.txt` for why font rasterization makes that
    # non-negotiable.
    #
    # A GitHub runner is natively amd64, so the platform pin costs nothing here;
    # on an Apple Silicon developer machine the same command runs emulated.
    visual:
        runs-on: ubuntu-latest

        # The suite itself takes seconds; the budget is almost entirely the base
        # image pull and `bun install`. A bound well above that still fails far
        # sooner than the 6-hour default if the container ever wedges.
        timeout-minutes: 25

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            # `bun install` and `bun run build` happen INSIDE the container, not
            # on the runner: the harness serves `dist/` bundles straight to
            # Chromium, so they must be built by the same toolchain that renders
            # them. Native dependencies built on the runner would also be
            # overwritten by the container's own node_modules mount.
            - name: Run visual suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && bun run test:visual'

            # Traces and failure screenshots are the only way to diagnose a
            # visual failure after the container is gone.
            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: visual-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    # Same-SHA release gate for the complete flow suite. This is deliberately
    # restricted to main pushes and manual dispatches so pull requests keep the
    # settled PR tier in `.github/workflows/e2e.yml`.
    e2e-full:
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  persist-credentials: false

            - name: Cache the pinned VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-vscode-${{ hashFiles('tests/e2e/hostFixtures/vscodeVersion.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-

            - name: Run the full flow suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && xvfb-run -a bun run test:e2e'

            - name: Upload full E2E failure artifacts
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: e2e-full-failures
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    release:
        # A visual regression must not reach the Marketplace. `build` alone was
        # the gate before the visual suite existed; leaving it that way would
        # mean the suite gates nothing on the one path that ships to users.
        needs: [build, visual, e2e-full]
        runs-on: ubuntu-latest
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && needs.visual.result == 'success' && (needs.e2e-full.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_e2e_gate == true)) }}
        permissions:
            contents: write

        steps:
            # Without this the bypass is invisible: the release log would show a successful publish
            # next to a red `e2e-full` and give no reason, leaving whoever audits it to go dig the
            # dispatch inputs out of the run summary.
            - name: Record that the E2E gate was overridden
              if: needs.e2e-full.result != 'success'
              run: echo "::warning::Published with a non-successful e2e-full gate via the skip_e2e_gate override."

            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  fetch-depth: 0

            - name: Check whether this version still needs releasing
              id: version-check
              env:
                  FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")

                  # Validated before the value can reach $GITHUB_OUTPUT. `echo "k=$v" >> $GITHUB_OUTPUT`
                  # writes one LINE PER NEWLINE in the value, so a version carrying a newline appends
                  # step outputs of its own choosing -- including `version_changed`, which every
                  # publishing step below gates on. Quoting the redirections does not help with that:
                  # the newline is in the value, not in the path. Validating once here does, and it
                  # covers all three writes across both branches plus any branch added later. A
                  # version that is not strict x.y.z is also simply invalid for a VS Code extension,
                  # so failing here costs a correct release nothing. %q renders the offending value
                  # with its newlines visible, because the whole point is a value whose shape does
                  # not survive being echoed.
                  if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "package.json version is not a strict x.y.z semver: $(printf '%q' "$CURRENT_VERSION")" >&2
                    exit 1
                  fi

                  echo "Current version: $CURRENT_VERSION"

                  # force_publish covers the one case the state gate below cannot see: the GitHub
                  # Release exists but a marketplace upload did not land. It only bypasses this
                  # gate; the publish-status guard (check-extension-publish-status.js) still
                  # prevents re-publishing an already-live version, so a forced re-run of the same
                  # version is safe. workflow_dispatch itself requires repo write access, which
                  # gates who can use it.
                  if [ "$FORCE_PUBLISH" = "true" ]; then
                    echo "Force publish requested via workflow_dispatch; bypassing the release-state gate."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # State, not diff. Comparing package.json against HEAD~1 asks "did THIS commit
                  # bump the version", which can never recover from a run that failed to reach this
                  # job: the bump is orphaned, and every later commit reports "unchanged" and skips
                  # forever. Measured -- 0.25.2's run failed at e2e-full and 0.25.3's run was
                  # cancelled, after which main could publish neither, with no failure anywhere to
                  # say so. The GitHub Release is the last artifact this job creates, so its absence
                  # is the honest answer to "has this version shipped". Asking that is idempotent:
                  # it publishes a bump, it skips an already-released version, and it self-heals a
                  # missed run on the next push. Every step below was already written to be
                  # re-runnable (publish-status guards, the tag-provenance guard, create-or-update
                  # release) -- this gate was the only part that was not.
                  #
                  # Only an HTTP status counts as an answer. Every way of asking exits 1 for a
                  # missing release AND for auth, rate-limit and network failures, so the exit code
                  # alone can never decide this -- and `gh release view`'s messages, which used to
                  # decide it here, are human-readable prose GitHub is free to reword under us. The
                  # release-by-tag REST endpoint answers the same question as a status code: 200 is
                  # present, 404 is absent, anything else is an unknown state.
                  #
                  # Measured on gh 2.87.3: `-i` prints the status line as the FIRST line of stdout
                  # for 200, 404 and 401 alike, while gh's own prose goes to stderr. So stdout is
                  # parsed for the decision and stderr is left unredirected, where it lands in the
                  # step log as the diagnostic. A gh that cannot run at all prints no status line,
                  # which parses to empty and falls through to the failure branch.
                  #
                  # Reading any of that as "never released" would republish on a transient blip and
                  # would report a broken token as "this version has not shipped" -- the exact
                  # misdiagnosis that left 0.25.2 and 0.25.3 unreleased. Failing instead costs
                  # nothing now that the gate reads state: the next push simply asks again.
                  RELEASE_PROBE=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$CURRENT_VERSION" || true)
                  HTTP_STATUS=$(printf '%s\n' "$RELEASE_PROBE" | awk 'NR == 1 { print $2 }')
                  if [ "$HTTP_STATUS" = "200" ]; then
                    echo "v$CURRENT_VERSION already has a GitHub Release; nothing to publish."
                    echo "version_changed=false" >> "$GITHUB_OUTPUT"
                  elif [ "$HTTP_STATUS" = "404" ]; then
                    echo "v$CURRENT_VERSION has no GitHub Release yet; publishing."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    echo "Could not read the release state of v$CURRENT_VERSION (HTTP ${HTTP_STATUS:-none})." >&2
                    exit 1
                  fi

            - name: Setup Node.js
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22"

            - name: Setup Bun
              if: steps.version-check.outputs.version_changed == 'true'
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install release dependencies
              if: steps.version-check.outputs.version_changed == 'true'
              run: bun install --frozen-lockfile

            - name: Check publish status
              if: steps.version-check.outputs.version_changed == 'true'
              id: publish-status
              run: node scripts/check-extension-publish-status.js

            - name: Download VSIX artifact
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: extension-vsix

            - name: Publish to VS Code Marketplace
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Skip VS Code Marketplace publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.vsce_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to VS Code Marketplace. Skipping."

            - name: Publish to Open VSX
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published != 'true'
              run: |
                  VSIX_PATH=$(ls *.vsix | head -n 1)
                  bunx ovsx publish -p "$OVSX_PAT" "$VSIX_PATH"
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Skip Open VSX publish
              if: steps.version-check.outputs.version_changed == 'true' && steps.publish-status.outputs.ovsx_published == 'true'
              run: echo "Version ${{ steps.version-check.outputs.new_version }} is already published to Open VSX. Skipping."

            - name: Create git tag
              if: steps.version-check.outputs.version_changed == 'true'
              run: |
                  VERSION="v$NEW_VERSION"
                  # An existing tag is only safe to reuse when it names THIS commit. The gate above
                  # asks whether the version has a Release, so a run that tagged and then died
                  # before creating one leaves the next push saying "publish" while the tag still
                  # points at the older commit -- and this step used to skip silently and ship the
                  # new build under the old tag. `^{commit}` peels annotated tags; checkout uses
                  # fetch-depth 0, so remote tags are present to resolve.
                  EXISTING_COMMIT=$(git rev-parse -q --verify "$VERSION^{commit}" 2>/dev/null || true)
                  if [ -n "$EXISTING_COMMIT" ]; then
                    if [ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]; then
                      echo "Tag $VERSION already points at $EXISTING_COMMIT, not this run's commit $GITHUB_SHA." >&2
                      echo "Publishing here would ship an artifact the tag does not name. Bump the version instead." >&2
                      exit 1
                    fi
                    echo "Tag $VERSION already points at this commit, skipping tag creation."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$VERSION"
                  git push origin "$VERSION"
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}

            - name: Check if GitHub release exists
              if: steps.version-check.outputs.version_changed == 'true'
              id: github-release-check
              run: |
                  VERSION="v$NEW_VERSION"
                  # Same status-code split as the version gate, and for the same reason: a status
                  # that is neither 200 nor 404 is an unknown state, not an absent release. Guessing
                  # "false" here sends the run into `gh release create` against a release that may
                  # well exist, so the run dies later with a misleading error instead of here with
                  # the real one.
                  RELEASE_PROBE=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" || true)
                  HTTP_STATUS=$(printf '%s\n' "$RELEASE_PROBE" | awk 'NR == 1 { print $2 }')
                  if [ "$HTTP_STATUS" = "200" ]; then
                    echo "release_exists=true" >> "$GITHUB_OUTPUT"
                  elif [ "$HTTP_STATUS" = "404" ]; then
                    echo "release_exists=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "Could not read the release state of $VERSION (HTTP ${HTTP_STATUS:-none})." >&2
                    exit 1
                  fi
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create GitHub Release and upload VSIX
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists != 'true'
              run: |
                  release_notes=()
                  if [ "${{ needs.e2e-full.result }}" != "success" ]; then
                    release_notes+=(--notes "E2E gate override: this release was published with a non-successful e2e-full gate via the skip_e2e_gate override.")
                  fi
                  gh release create "v$NEW_VERSION" *.vsix --generate-notes "${release_notes[@]}"
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Update GitHub Release asset
              if: steps.version-check.outputs.version_changed == 'true' && steps.github-release-check.outputs.release_exists == 'true'
              run: |
                  gh release upload "v$NEW_VERSION" *.vsix --clobber
                  if [ "${{ needs.e2e-full.result }}" != "success" ]; then
                    override_notice="E2E gate override: this release was published with a non-successful e2e-full gate via the skip_e2e_gate override."
                    current_notes="$(gh release view "v$NEW_VERSION" --json body --jq .body)"
                    if [[ "$current_notes" != *"$override_notice"* ]]; then
                      gh release edit "v$NEW_VERSION" --notes "${current_notes}"$'\n\n'"${override_notice}"
                    fi
                  fi
              env:
                  NEW_VERSION: ${{ steps.version-check.outputs.new_version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
