name: CI - Build & Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
        inputs:
            force_publish:
                description: "Retry the current-run package only; for partial publication recovery use recovery_run_id and recovery_sha256."
                type: boolean
                default: false
            skip_e2e_gate:
                description: "Allow a manual main-branch release to proceed when the same-SHA full E2E gate fails; use only after auditing the failure."
                type: boolean
                default: false
            recovery_run_id:
                description: "Historical publish.yml run whose original extension-vsix artifact should be recovered."
                type: string
                default: ""
            recovery_sha256:
                description: "Expected SHA256 of the historical VSIX; must be supplied with recovery_run_id."
                type: string
                default: ""

# Keyed by event so a manual workflow_dispatch on main cannot cancel an
# in-flight push-triggered release run (they target the same ref).
concurrency:
    # Main runs share nothing: `github.run_id` is unique per run, so every merge starts its checks
    # immediately. This workflow both validates and publishes, and those two needs pull opposite
    # ways -- a superseded release must survive, which forbids cancelling, while sharing a group
    # without cancelling means QUEUEING. One slow or parked job then holds every later merge's
    # build, visual and e2e-full behind a release they have nothing to do with. Measured
    # 2026-08-17: the release job sat on an unapproved deployment environment from 07:45; the merge
    # behind it queued and was silently cancelled when a third arrived, so #197's checks never ran
    # on main at all and #200's never started -- 13 hours, with no failure reported anywhere.
    # Releases still serialize, on the `release` job's own group, where a queue delays only the
    # next release.
    group: build-release-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'shared' }}
    # A superseded pull-request run is waste worth cancelling; a superseded main run is a lost
    # release: a cancelled run reports no failure, shows no red X, and notifies nobody. Measured:
    # v0.25.3's release run was cancelled by the merge that followed it minutes later, and the
    # release was silently lost. Main pushes are unreachable by this switch now that each holds its
    # own group, and it stays ref-conditional so restoring a shared group cannot also silently
    # restore cancellation.
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

env:
    BUN_VERSION: "1.3.5"

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Cache Bun
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.bun/install/cache
                      ~/.cache/ms-playwright
                  # `node_modules` is deliberately NOT cached. Restoring a materialised tree and
                  # then reconciling it with `bun install --frozen-lockfile` is incremental: after
                  # the Dependabot batch moved a nested dependency (brace-expansion@5 needs its own
                  # balanced-match@4), the restore-keys fallback handed back the pre-upgrade tree,
                  # bun re-linked only what it considered changed, and ESLint crashed on the stale
                  # balanced-match@1.0.2 that was left at the root. A warm package store gives the
                  # same speed and cannot produce a half-reconciled tree. The key prefix is bumped
                  # so no archive saved before this change can be restored.
                  key: ${{ runner.os }}-bun-v2-${{ hashFiles('bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-v2-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The coverage suite includes a real Chromium proof for the visual
            # comparator, so this browser is a test dependency rather than a cache
            # optimisation.
            - name: Install the Playwright browser the comparator proof runs against
              run: bunx playwright install --with-deps chromium

            - name: Check formatting
              run: bun run format:check

            - name: Run React Doctor
              run: bun run react-doctor

            - name: Run strict ESLint
              run: bun run lint:strict

            - name: Check unused files and dependencies
              run: bun run deps:check:strict

            - name: Check architecture boundaries
              run: bun run architecture:check

            - name: Check manifest does not expose E2E control commands
              run: bun run verify:manifest

            - name: Validate localization catalogs
              run: bun run l10n:validate

            - name: Audit hardcoded localization strings
              run: bun run l10n:audit

            - name: Run type check
              run: bun run typecheck

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Build extension
              run: bun run build

            - name: Package extension
              run: bun run package

            - name: Resolve packaged VSIX and create checksum
              id: package-artifact
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  if [ "${#vsix_files[@]}" -ne 1 ]; then
                    echo "Expected exactly one packaged VSIX, found ${#vsix_files[@]}." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  sha256sum "$VSIX_PATH" > "$CHECKSUM_PATH"
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
                  echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

            - name: Upload release artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: extension-vsix
                  path: |
                      *.vsix
                      *.vsix.sha256
                  if-no-files-found: error
                  retention-days: 30

    # Blocks a PR from carrying a CI-skip token into main via squash merge.
    guard-no-skip-ci:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Reject CI-skip directives in PR commits and metadata
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  PR_BODY: ${{ github.event.pull_request.body }}
              run: node scripts/check-no-skip-ci.js

    # The visual suite executes in the same digest-pinned Linux image that
    # maintains its baselines. Container jobs run as root and make Chromium
    # diverge, so the wrapper runs the image unprivileged instead.
    visual:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Run visual suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && bun run test:visual'

            - name: Upload visual failure artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: visual-failures
                  # `playwright-report/` is the HTML reporter's directory and nothing here uses
                  # that reporter -- the e2e config pins `list` and the visual config names none,
                  # whose default is `list`/`dot`. Listing it made the upload look like it kept
                  # two kinds of evidence while only `test-results/` ever existed.
                  #
                  # `warn` rather than `ignore` for the same reason: a failure that produced no
                  # artifacts at all is the case worth seeing, since it means the job died before
                  # the suite ran. `warn` annotates it without failing the step.
                  path: test-results/
                  if-no-files-found: warn
                  retention-days: 7

    # The flow suite, and the same-SHA gate the release chain below waits on.
    #
    # It carries no `if:` on purpose. It used to be guarded to main pushes and
    # dispatches, which meant the job the release gate names reported `skipping`
    # on every pull request -- so the suite first ran after the merge, where it
    # can no longer stop one. Measured: 0.25.4's push to main went red here
    # behind a pull request that had been green without ever running this job.
    #
    # `.github/workflows/e2e.yml` runs the byte-identical suite for the pull
    # requests this workflow does not see (those based on anything but main), so
    # exactly one job executes it per event -- pinned by the duplication check in
    # tests/unit/visual/publishWorkflow.test.ts.
    e2e-full:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Cache the pinned VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-vscode-${{ hashFiles('tests/e2e/hostFixtures/vscodeVersion.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vscode-

            - name: Run the full flow suite in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && xvfb-run -a bun run test:e2e'

            - name: Upload full E2E failure artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-full-failures
                  # See the visual job's upload: no reporter here writes `playwright-report/`, and
                  # a failure carrying no artifacts is worth an annotation rather than silence.
                  path: test-results/
                  if-no-files-found: warn
                  retention-days: 7

    package-smoke:
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                vscode_version: ["1.107.0", "1.137.0"]

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download packaged VSIX
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Cache the package-smoke VS Code build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/intelligit-e2e-container/vscode
                  key: ${{ runner.os }}-package-smoke-vscode-${{ matrix.vscode_version }}

            - name: Verify downloaded VSIX and checksum
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  if [ "${checksum_files[0]}" != "${vsix_files[0]}.sha256" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  sha256sum --check "${checksum_files[0]}"

            - name: Run installed package smoke in the pinned container
              run: ./tests/e2e/docker/run.sh 'bun install --frozen-lockfile && bun run build && INTELLIGIT_VSCODE_VERSION=${{ matrix.vscode_version }} xvfb-run -a bun run test:package-smoke'

            # Without this the only evidence a package-smoke failure leaves is the log: Playwright
            # writes its screenshot, error context, and trace inside the container, and the job ends
            # before anything reads them. e2e-full already uploads the same paths.
            - name: Upload package smoke failure artifacts
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: package-smoke-failures-${{ matrix.vscode_version }}
                  # See the visual job's upload: no reporter here writes `playwright-report/`, and
                  # a failure carrying no artifacts is worth an annotation rather than silence.
                  # This job can fail before the suite runs at all -- the VSIX checksum check and
                  # the container's own install and build all precede it -- so that case is real.
                  path: test-results/
                  if-no-files-found: warn
                  retention-days: 7

    # Eligibility has no production environment or secrets. It is deliberately
    # split from the publishing job so a same-version change never instantiates
    # a job that can access Marketplace credentials.
    release-eligibility:
        needs: [build, visual, e2e-full, package-smoke]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && needs.visual.result == 'success' && needs.package-smoke.result == 'success' && (needs.e2e-full.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_e2e_gate == true)) }}
        outputs:
            version_changed: ${{ steps.version-check.outputs.version_changed }}
            new_version: ${{ steps.version-check.outputs.new_version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Check whether this version still needs releasing
              id: version-check
              env:
                  FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish == true }}
                  RECOVERY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_run_id || '' }}
                  RECOVERY_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_sha256 || '' }}
                  PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $CURRENT_VERSION"

                  if [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
                    PREVIOUS_VERSION=$(git show "$PUSH_BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                    PREVIOUS_VERSION=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  else
                    PREVIOUS_VERSION="0.0.0"
                  fi

                  echo "Previous version: $PREVIOUS_VERSION"
                  if { [ -n "$RECOVERY_RUN_ID" ] && [ -z "$RECOVERY_SHA256" ]; } || { [ -z "$RECOVERY_RUN_ID" ] && [ -n "$RECOVERY_SHA256" ]; }; then
                    echo "Recovery run id and SHA256 must be supplied together." >&2
                    exit 1
                  fi
                  if [ -n "$RECOVERY_RUN_ID" ]; then
                    node scripts/verifyReleaseVersion.js --require-equal "$CURRENT_VERSION" "$CURRENT_VERSION"
                    echo "Historical artifact recovery requested for run $RECOVERY_RUN_ID."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if [ "$FORCE_PUBLISH" = "true" ]; then
                    node scripts/verifyReleaseVersion.js --require-equal "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                    echo "Force publish recovery accepted for unchanged version $CURRENT_VERSION."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  # The version transition is validated on its own terms, separately from the decision
                  # to publish. `verifyReleaseVersion.js` rejects anything that is not canonical stable
                  # SemVer -- leading zeros, prerelease and build metadata included -- which also keeps
                  # a value carrying a newline out of $GITHUB_OUTPUT, where `echo "k=$v"` would append
                  # step outputs of its own choosing, `version_changed` among them.
                  #
                  # The forward check runs only when the version actually moved. Requiring
                  # current > previous unconditionally would reject the recovery case below, where an
                  # orphaned bump is republished from a LATER commit that did not touch the version.
                  # An unchanged version is instead asserted equal, which validates the shape of both
                  # values without asserting an ordering that did not happen.
                  if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
                    node scripts/verifyReleaseVersion.js --require-equal "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                  else
                    node scripts/verifyReleaseVersion.js "$PREVIOUS_VERSION" "$CURRENT_VERSION"
                  fi

                  # State, not diff. Comparing package.json against the previous commit asks "did THIS
                  # push bump the version", which can never recover from a run that failed to reach the
                  # release job: the bump is orphaned, and every later commit reports "unchanged" and
                  # skips forever. Measured -- 0.25.2's run failed at e2e-full and 0.25.3's run was
                  # cancelled, after which main could publish neither, with no failure anywhere to say
                  # so. The GitHub Release is the last artifact the release job creates, so its absence
                  # is the honest answer to "has this version shipped". Asking that is idempotent: it
                  # publishes a bump, it skips an already-released version, and it self-heals a missed
                  # run on the next push.
                  #
                  # Only an HTTP status counts as an answer. Every way of asking exits 1 for a missing
                  # release AND for auth, rate-limit and network failures, so the exit code alone can
                  # never decide this -- and `gh release view`'s messages, which used to decide it, are
                  # human-readable prose GitHub is free to reword under us. The release-by-tag REST
                  # endpoint answers the same question as a status code: 200 is present, 404 is absent,
                  # anything else is an unknown state.
                  #
                  # Measured on gh 2.87.3: `-i` prints the status line as the FIRST line of stdout for
                  # 200, 404 and 401 alike, while gh's own prose goes to stderr. So stdout is parsed
                  # for the decision and stderr is left unredirected, where it lands in the step log as
                  # the diagnostic. A gh that cannot run at all prints no status line, which parses to
                  # empty and falls through to the failure branch.
                  #
                  # Reading any of that as "never released" would republish on a transient blip and
                  # would report a broken token as "this version has not shipped" -- the exact
                  # misdiagnosis that left 0.25.2 and 0.25.3 unreleased. Failing instead costs nothing
                  # now that the gate reads state: the next push simply asks again.
                  RELEASE_PROBE=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$CURRENT_VERSION" || true)
                  HTTP_STATUS=$(printf '%s\n' "$RELEASE_PROBE" | awk 'NR == 1 { print $2 }')
                  if [ "$HTTP_STATUS" = "200" ]; then
                    echo "v$CURRENT_VERSION already has a GitHub Release; nothing to publish."
                    echo "version_changed=false" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  elif [ "$HTTP_STATUS" = "404" ]; then
                    echo "v$CURRENT_VERSION has no GitHub Release yet; publishing."
                    echo "version_changed=true" >> "$GITHUB_OUTPUT"
                    echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
                  else
                    echo "Could not read the release state of v$CURRENT_VERSION (HTTP ${HTTP_STATUS:-none})." >&2
                    exit 1
                  fi

    attest:
        needs: [build, release-eligibility]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.release-eligibility.result == 'success' && needs.release-eligibility.outputs.version_changed == 'true' }}
        permissions:
            contents: read
            id-token: write
            attestations: write

        steps:
            - name: Download packaged VSIX
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Resolve and verify attestation subject
              id: release-artifact
              shell: bash
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  if [ "${checksum_files[0]}" != "$CHECKSUM_PATH" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  sha256sum --check "$CHECKSUM_PATH"
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"

            - name: Attest packaged VSIX provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: ${{ steps.release-artifact.outputs.vsix_path }}

    release:
        needs: [build, visual, e2e-full, package-smoke, release-eligibility, attest]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # Publishing serializes here rather than at the workflow level, so a release that has to
        # wait delays only the next release -- never the checks that gate it. Two releases must not
        # run at once: the tag, both marketplace uploads and the GitHub Release are all
        # version-keyed side effects, and an out-of-order pair leaves the marketplace showing the
        # older version as current. `cancel-in-progress: false` for the reason on the workflow-level
        # block: a cancelled release is a silently lost one.
        #
        # `queue: max` because `cancel-in-progress: false` alone does not mean "everything waits".
        # The default, `queue: single`, holds at most ONE run pending per group and cancels that one
        # when a third arrives -- the same silent cancellation this workflow was restructured to
        # escape, moved down a level. Three merges in a row would publish the first and the third
        # and drop the second, and the state-based gate above cannot recover it: that gate reads the
        # version at the CURRENT commit, so once a later bump lands, the skipped one is never asked
        # about again. It is how v0.25.2 disappeared. `max` queues up to 100 and runs them FIFO.
        #
        # It is sound only beside a literal `cancel-in-progress: false`: GitHub fails workflow
        # VALIDATION when a queued group can also cancel, which stops every job in the file rather
        # than just this one. That is why it is not copied to the workflow-level block, whose
        # cancel-in-progress is an expression that evaluates true on pull requests.
        #
        # There is deliberately no `environment:`. A deployment environment is the only way a job
        # acquires a manual gate, and a job parked in `waiting` is what held main for 13 hours on
        # 2026-08-17. It scoped nothing in exchange: VSCE_PAT and OVSX_PAT are repository secrets,
        # reachable from any job in this workflow with or without it, and the environment's branch
        # policy is already asserted below by `github.ref == 'refs/heads/main'`.
        concurrency:
            group: marketplace-release
            cancel-in-progress: false
            queue: max
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.build.result == 'success' && needs.visual.result == 'success' && needs.package-smoke.result == 'success' && (needs.e2e-full.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_e2e_gate == true)) && needs.release-eligibility.result == 'success' && needs.release-eligibility.outputs.version_changed == 'true' && needs.attest.result == 'success' }}
        permissions:
            contents: write
            actions: read
            attestations: read

        steps:
            # Without this the bypass is invisible in the release history: the
            # job annotation expires with logs while the release must stay auditable.
            - name: Record that the E2E gate was overridden
              if: needs.e2e-full.result != 'success'
              run: echo "::warning::Published with a non-successful e2e-full gate via the skip_e2e_gate override."

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"

            - name: Setup Bun
              uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
              with:
                  bun-version: ${{ env.BUN_VERSION }}

            - name: Install release dependencies
              run: bun install --frozen-lockfile

            - name: Resolve historical recovery source
              id: release-source
              shell: bash
              env:
                  RECOVERY_RUN_ID: ${{ inputs.recovery_run_id || '' }}
                  RECOVERY_SHA256: ${{ inputs.recovery_sha256 || '' }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if { [ -n "$RECOVERY_RUN_ID" ] && [ -z "$RECOVERY_SHA256" ]; } || { [ -z "$RECOVERY_RUN_ID" ] && [ -n "$RECOVERY_SHA256" ]; }; then
                    echo "Recovery run id and SHA256 must be supplied together." >&2
                    exit 1
                  fi
                  if [ -z "$RECOVERY_RUN_ID" ]; then
                    echo "recovery_mode=false" >> "$GITHUB_OUTPUT"
                    echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  if ! [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]] || ! [[ "$RECOVERY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
                    echo "Recovery run id must be numeric and SHA256 must be 64 lowercase hexadecimal characters." >&2
                    exit 1
                  fi

                  RUN_FIELDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN_ID" \
                    --jq '[.path, .head_branch, .head_sha, .repository.full_name, .event] | @tsv')
                  IFS=$'\t' read -r RUN_PATH RUN_BRANCH RUN_SHA RUN_REPOSITORY RUN_EVENT <<< "$RUN_FIELDS"
                  if [ "$RUN_PATH" != ".github/workflows/publish.yml" ] || [ "$RUN_BRANCH" != "main" ] || [ "refs/heads/$RUN_BRANCH" != "refs/heads/main" ] || [ "$RUN_REPOSITORY" != "$GITHUB_REPOSITORY" ] || [ "$RUN_EVENT" != "push" ]; then
                    echo "Recovery requires a push run of this repository's publish.yml on refs/heads/main." >&2
                    exit 1
                  fi
                  if ! [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "Selected run returned an invalid head SHA." >&2
                    exit 1
                  fi
                  echo "recovery_mode=true" >> "$GITHUB_OUTPUT"
                  echo "run_id=$RECOVERY_RUN_ID" >> "$GITHUB_OUTPUT"
                  echo "source_sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

            - name: Download current-run packaged VSIX
              if: steps.release-source.outputs.recovery_mode != 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix

            - name: Download historical packaged VSIX
              if: steps.release-source.outputs.recovery_mode == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: extension-vsix
                  run-id: ${{ steps.release-source.outputs.run_id }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve and verify release artifact
              id: release-artifact
              shell: bash
              env:
                  RECOVERY_MODE: ${{ steps.release-source.outputs.recovery_mode }}
                  RECOVERY_SHA256: ${{ inputs.recovery_sha256 || '' }}
                  SOURCE_SHA: ${{ steps.release-source.outputs.source_sha }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  shopt -s nullglob
                  vsix_files=(*.vsix)
                  checksum_files=(*.vsix.sha256)
                  if [ "${#vsix_files[@]}" -ne 1 ] || [ "${#checksum_files[@]}" -ne 1 ]; then
                    echo "Expected one VSIX and one checksum artifact." >&2
                    exit 1
                  fi
                  VSIX_PATH="${vsix_files[0]}"
                  CHECKSUM_PATH="${VSIX_PATH}.sha256"
                  if [ "${checksum_files[0]}" != "$CHECKSUM_PATH" ]; then
                    echo "Checksum artifact does not belong to the downloaded VSIX." >&2
                    exit 1
                  fi
                  ACTUAL_SHA256=$(sha256sum "$VSIX_PATH" | awk '{ print $1 }')
                  if [ "$(cat "$CHECKSUM_PATH")" != "$ACTUAL_SHA256  $VSIX_PATH" ]; then
                    echo "Checksum file must contain exactly the selected VSIX digest and filename." >&2
                    exit 1
                  fi
                  sha256sum --check "$CHECKSUM_PATH"

                  VSIX_PACKAGE_JSON=$(mktemp)
                  if ! unzip -p "$VSIX_PATH" extension/package.json > "$VSIX_PACKAGE_JSON"; then
                    echo "Unable to read extension/package.json from the selected VSIX." >&2
                    exit 1
                  fi
                  SOURCE_PACKAGE_JSON="package.json"
                  if [ "$RECOVERY_MODE" = "true" ]; then
                    if [ "$ACTUAL_SHA256" != "$RECOVERY_SHA256" ]; then
                      echo "Historical VSIX SHA256 $ACTUAL_SHA256 does not match the explicit recovery SHA256." >&2
                      exit 1
                    fi
                    SOURCE_PACKAGE_JSON=$(mktemp)
                    gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$SOURCE_SHA" --jq .content | tr -d '\n' | base64 --decode > "$SOURCE_PACKAGE_JSON"
                  fi
                  PACKAGE_FIELDS=$(node -e '
                    const fs = require("fs");
                    const actual = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                    const expected = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                    for (const field of ["publisher", "name", "version"]) {
                      if (actual[field] !== expected[field] || typeof actual[field] !== "string") {
                        throw new Error(`VSIX package ${field} does not match source package.json`);
                      }
                    }
                    process.stdout.write([actual.publisher, actual.name, actual.version].join("\t"));
                  ' "$VSIX_PACKAGE_JSON" "$SOURCE_PACKAGE_JSON")
                  IFS=$'\t' read -r EXTENSION_PUBLISHER EXTENSION_NAME NEW_VERSION <<< "$PACKAGE_FIELDS"

                  if [ "$RECOVERY_MODE" = "true" ]; then
                    gh attestation verify "$VSIX_PATH" --repo "$GITHUB_REPOSITORY" \
                      --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
                      --source-digest "$SOURCE_SHA" \
                      --source-ref refs/heads/main
                  fi
                  echo "vsix_path=$VSIX_PATH" >> "$GITHUB_OUTPUT"
                  echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"
                  echo "package_json_path=$VSIX_PACKAGE_JSON" >> "$GITHUB_OUTPUT"
                  echo "publisher=$EXTENSION_PUBLISHER" >> "$GITHUB_OUTPUT"
                  echo "name=$EXTENSION_NAME" >> "$GITHUB_OUTPUT"
                  echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

            - name: Check publish status
              id: publish-status
              shell: bash
              env:
                  RECOVERY_MODE: ${{ steps.release-source.outputs.recovery_mode }}
                  PACKAGE_JSON_PATH: ${{ steps.release-artifact.outputs.package_json_path }}
              run: |
                  if [ "$RECOVERY_MODE" = "true" ]; then
                    node scripts/check-extension-publish-status.js "$PACKAGE_JSON_PATH"
                  else
                    node scripts/check-extension-publish-status.js
                  fi

            - name: Verify published registries and GitHub Release
              id: registry-state
              shell: bash
              run: |
                  if [ "$RECOVERY_MODE" != "true" ] && { [ "$VSCE_PUBLISHED" = "true" ] || [ "$OVSX_PUBLISHED" = "true" ]; }; then
                    echo "A published version must be recovered from its original artifact; refusing to publish rebuilt bytes for the same version." >&2
                    exit 1
                  fi

                  compare_registry_artifact() {
                    local registry_name="$1"
                    local registry_url="$2"
                    local registry_vsix
                    registry_vsix=$(mktemp "${TMPDIR:-/tmp}/registry-vsix.XXXXXX")
                    if [ "$registry_name" = "VS Code Marketplace" ]; then
                      curl --fail --location --silent --show-error --compressed --output "$registry_vsix" "$registry_url"
                    else
                      curl --fail --location --silent --show-error --output "$registry_vsix" "$registry_url"
                    fi
                    if ! cmp --silent "$VSIX_PATH" "$registry_vsix"; then
                      echo "$registry_name artifact does not match the selected artifact; failing closed." >&2
                      return 1
                    fi
                    echo "$registry_name already contains byte-identical v$NEW_VERSION; skipping it."
                  }

                  if [ "$VSCE_PUBLISHED" = "true" ]; then
                    compare_registry_artifact "VS Code Marketplace" "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$EXTENSION_PUBLISHER/vsextensions/$EXTENSION_NAME/$NEW_VERSION/vspackage"
                  fi
                  if [ "$OVSX_PUBLISHED" = "true" ]; then
                    compare_registry_artifact "Open VSX" "https://open-vsx.org/api/$EXTENSION_PUBLISHER/$EXTENSION_NAME/$NEW_VERSION/file/$EXTENSION_PUBLISHER.$EXTENSION_NAME-$NEW_VERSION.vsix"
                  fi

                  RELEASE_PROBE=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/v$NEW_VERSION" || true)
                  HTTP_STATUS=$(printf '%s\n' "$RELEASE_PROBE" | awk 'NR == 1 { print $2 }')
                  if [ "$HTTP_STATUS" = "200" ]; then
                    echo "A GitHub release already exists for v$NEW_VERSION; refusing to replace its assets or skip unverified assets." >&2
                    exit 1
                  fi
                  if [ "$HTTP_STATUS" != "404" ]; then
                    echo "Unable to determine whether the GitHub release exists (HTTP ${HTTP_STATUS:-none}); failing closed." >&2
                    exit 1
                  fi
                  echo "create_release=true" >> "$GITHUB_OUTPUT"
              env:
                  RECOVERY_MODE: ${{ steps.release-source.outputs.recovery_mode }}
                  VSCE_PUBLISHED: ${{ steps.publish-status.outputs.vsce_published }}
                  OVSX_PUBLISHED: ${{ steps.publish-status.outputs.ovsx_published }}
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  EXTENSION_PUBLISHER: ${{ steps.release-artifact.outputs.publisher }}
                  EXTENSION_NAME: ${{ steps.release-artifact.outputs.name }}
                  NEW_VERSION: ${{ steps.release-artifact.outputs.version }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate and create release tag
              shell: bash
              run: |
                  VERSION="v$NEW_VERSION"
                  TAG_ERROR=$(mktemp)
                  if ! TAG_REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '[.object.type, .object.sha] | @tsv' 2>"$TAG_ERROR"); then
                    if ! grep -q '(HTTP 404)' "$TAG_ERROR"; then
                      cat "$TAG_ERROR" >&2
                      echo "Unable to read the live release tag; failing closed." >&2
                      exit 1
                    fi
                    gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                      -f ref="refs/tags/$VERSION" \
                      -f sha="$EXPECTED_SHA" >/dev/null
                    TAG_REF=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --jq '[.object.type, .object.sha] | @tsv')
                  fi
                  IFS=$'\t' read -r TAG_TYPE TAG_SHA <<< "$TAG_REF"
                  if [ "$TAG_TYPE" != "commit" ] || [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
                    echo "Live tag $VERSION resolves to $TAG_TYPE $TAG_SHA, expected commit $EXPECTED_SHA." >&2
                    exit 1
                  fi
                  echo "Live tag $VERSION resolves to the current release SHA."
              env:
                  NEW_VERSION: ${{ steps.release-artifact.outputs.version }}
                  EXPECTED_SHA: ${{ steps.release-source.outputs.source_sha }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish to VS Code Marketplace
              if: steps.publish-status.outputs.vsce_published != 'true'
              run: bunx vsce publish --packagePath "$VSIX_PATH" -p "$VSCE_PAT"
              env:
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Publish to Open VSX
              if: steps.publish-status.outputs.ovsx_published != 'true'
              shell: bash
              run: |
                  is_transient_open_vsx_error() {
                    grep -Eiq '(^|[^0-9])(408|429|5[0-9]{2})([^0-9]|$)|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|network|socket hang up|fetch failed|connection reset|timed out' "$1"
                  }

                  probe_open_vsx() {
                    local metadata_file error_file registry_vsix
                    metadata_file=$(mktemp)
                    error_file=$(mktemp)
                    if bunx ovsx get "$EXTENSION_ID" --metadata --versionRange "$NEW_VERSION" > "$metadata_file" 2> "$error_file"; then
                      if ! node -e '
                        const metadata = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                        const version = process.argv[2];
                        if (metadata.version !== version && !Object.prototype.hasOwnProperty.call(metadata.allVersions ?? {}, version)) process.exit(1);
                      ' "$metadata_file" "$NEW_VERSION"; then
                        echo "Open VSX returned metadata that did not prove v$NEW_VERSION is live; failing closed." >&2
                        return 3
                      fi
                      registry_vsix=$(mktemp "${TMPDIR:-/tmp}/open-vsx.XXXXXX")
                      if ! curl --fail --location --silent --show-error --output "$registry_vsix" "https://open-vsx.org/api/$EXTENSION_PUBLISHER/$EXTENSION_NAME/$NEW_VERSION/file/$EXTENSION_PUBLISHER.$EXTENSION_NAME-$NEW_VERSION.vsix"; then
                        echo "Open VSX reported v$NEW_VERSION live but its VSIX could not be read; failing closed." >&2
                        return 3
                      fi
                      if ! cmp --silent "$VSIX_PATH" "$registry_vsix"; then
                        echo "Open VSX reported v$NEW_VERSION live but its bytes do not match the selected artifact; failing closed." >&2
                        return 3
                      fi
                      return 0
                    fi
                    if grep -Eiq 'has no published version matching|extension .*not found|no extension found' "$error_file"; then
                      return 1
                    fi
                    cat "$error_file" >&2
                    if is_transient_open_vsx_error "$error_file"; then
                      echo "Open VSX re-probe failed transiently; preserving the bounded publish retry." >&2
                      return 2
                    fi
                    echo "Unable to re-probe Open VSX after a failed publish; failing closed." >&2
                    return 3
                  }

                  for attempt in 1 2 3; do
                    publish_log=$(mktemp)
                    if bunx ovsx publish -p "$OVSX_PAT" "$VSIX_PATH" > "$publish_log" 2>&1; then
                      cat "$publish_log"
                      exit 0
                    fi
                    cat "$publish_log" >&2

                    if probe_open_vsx; then
                      echo "Open VSX v$NEW_VERSION became live with byte-identical contents after attempt $attempt."
                      exit 0
                    else
                      probe_status=$?
                      if [ "$probe_status" -eq 3 ]; then
                        exit 1
                      fi
                    fi

                    if ! is_transient_open_vsx_error "$publish_log"; then
                      echo "Open VSX publish failure is non-transient; not retrying." >&2
                      exit 1
                    fi
                    if [ "$attempt" -eq 3 ]; then
                      echo "Open VSX publish failed after three transient attempts." >&2
                      exit 1
                    fi
                    sleep $((attempt * 2))
                  done
              env:
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
                  EXTENSION_ID: ${{ steps.release-artifact.outputs.publisher }}.${{ steps.release-artifact.outputs.name }}
                  EXTENSION_PUBLISHER: ${{ steps.release-artifact.outputs.publisher }}
                  EXTENSION_NAME: ${{ steps.release-artifact.outputs.name }}
                  NEW_VERSION: ${{ steps.release-artifact.outputs.version }}

            - name: Create GitHub Release and upload artifacts
              if: steps.registry-state.outputs.create_release == 'true'
              shell: bash
              run: |
                  release_notes=()
                  if [ "${{ needs.e2e-full.result }}" != "success" ]; then
                    release_notes+=(--notes "E2E gate override: this release was published with a non-successful e2e-full gate via the skip_e2e_gate override.")
                  fi
                  gh release create "v$NEW_VERSION" "$VSIX_PATH" "$CHECKSUM_PATH" --generate-notes "${release_notes[@]}"
              env:
                  NEW_VERSION: ${{ steps.release-artifact.outputs.version }}
                  VSIX_PATH: ${{ steps.release-artifact.outputs.vsix_path }}
                  CHECKSUM_PATH: ${{ steps.release-artifact.outputs.checksum_path }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
